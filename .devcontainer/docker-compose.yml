services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: donnici
      POSTGRES_PASSWORD: donnici
      POSTGRES_DB: donnici
    volumes:
      - donnici-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donnici -d donnici"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  donnici-pgdata:
